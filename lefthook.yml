pre-commit:
  jobs:
    - name: format
      run: pnpm exec oxfmt --config ./oxfmt.config.ts --no-error-on-unmatched-pattern {staged_files}
      glob: "*.{ts,tsx,json,md,css}"
      stage_fixed: true

    - name: lint
      run: pnpm exec oxlint --config ./oxlint.config.ts --deny-warnings --fix --no-error-on-unmatched-pattern {staged_files}
      glob: "*.{ts,tsx}"
      exclude:
        - ".agents/**"
      stage_fixed: true

    - name: type-check-themes
      run: pnpm --filter @wrksz/themes type-check

    - name: type-check-docs
      run: pnpm --filter theme-docs types:check
