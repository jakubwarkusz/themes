pre-commit:
  jobs:
    - name: format
      run: bunx oxfmt --config ./oxfmt.config.ts --no-error-on-unmatched-pattern {staged_files}
      glob: "*.{ts,tsx,json,md,css}"
      stage_fixed: true

    - name: lint
      run: bunx oxlint --config ./oxlint.config.ts --deny-warnings --fix --no-error-on-unmatched-pattern {staged_files}
      glob: "*.{ts,tsx}"
      exclude:
        - ".agents/**"
      stage_fixed: true

    - name: type-check-themes
      run: bun run --cwd packages/themes type-check

    - name: type-check-docs
      run: bun run --cwd apps/docs types:check
