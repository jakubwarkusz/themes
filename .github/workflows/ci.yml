name: CI

on:
  push:
    branches: [main]
    paths:
      - "packages/themes/**"
      - "apps/docs/**"
      - "package.json"
      - "bun.lock"
      - "biome.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/themes/**"
      - "apps/docs/**"
      - "package.json"
      - "bun.lock"
      - "biome.json"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  library:
    name: Library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run --cwd packages/themes type-check

      - name: Test
        run: bun run --cwd packages/themes test

      - name: Build
        run: bun run --cwd packages/themes build

      - name: Bundle size
        run: bun run --cwd packages/themes size

      - name: Bundle size baseline
        run: bun run --cwd packages/themes size:compare

  typescript-compatibility:
    name: TypeScript ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "5.9.3"
            script: "type-check:compat:5.9"
          - version: "6.0.2"
            script: "type-check:compat:6"
          - version: "7.0.2"
            script: "type-check:compat:7"
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check source and published package
        run: bun run --cwd packages/themes ${{ matrix.script }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run --cwd apps/docs test

      - name: Type check
        run: bun run --cwd apps/docs types:check

      - name: Build
        run: bun run build:docs
