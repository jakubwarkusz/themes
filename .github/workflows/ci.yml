name: CI

on:
  push:
    branches: [main]
    paths:
      - "packages/themes/**"
      - "apps/docs/**"
      - "apps/next-16-3/**"
      - "package.json"
      - "bun.lock"
      - "oxlint.config.ts"
      - "oxfmt.config.ts"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/themes/**"
      - "apps/docs/**"
      - "apps/next-16-3/**"
      - "package.json"
      - "bun.lock"
      - "oxlint.config.ts"
      - "oxfmt.config.ts"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Audit high severity dependencies
        run: bun audit --audit-level=high

  library:
    name: Library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run --cwd packages/themes type-check

      - name: Test
        run: bun run --cwd packages/themes test

      - name: Build
        run: bun run --cwd packages/themes build

      - name: Bundle size
        run: bun run --cwd packages/themes size

      - name: Bundle size baseline
        run: bun run --cwd packages/themes size:compare

  react-compatibility:
    name: React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - react: "18.3.1"
            react-types: "18.3.23"
            react-dom-types: "18.3.7"
          - react: "19.2.4"
            react-types: "19.2.14"
            react-dom-types: "19.2.3"
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Select React version
        run: >-
          bun add --no-save --dev
          react@${{ matrix.react }}
          react-dom@${{ matrix.react }}
          @types/react@${{ matrix.react-types }}
          @types/react-dom@${{ matrix.react-dom-types }}

      - name: Test effect event compatibility
        run: bun run --cwd packages/themes test src/__tests__/use-effect-event-compat.test.tsx

      - name: Build
        run: bun run --cwd packages/themes build

  typescript-compatibility:
    name: TypeScript ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "5.9.3"
            script: "type-check:compat:5.9"
          - version: "6.0.2"
            script: "type-check:compat:6"
          - version: "7.0.2"
            script: "type-check:compat:7"
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check source and published package
        run: bun run --cwd packages/themes ${{ matrix.script }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build library
        run: bun run --cwd packages/themes build

      - name: Test
        run: bun run --cwd apps/docs test

      - name: Type check
        run: bun run --cwd apps/docs types:check

      - name: Build
        run: bun run build:docs

  next-16-3:
    name: Next.js 16.3 Instant Navigations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build library
        run: bun run --cwd packages/themes build

      - name: Type check
        run: bun run --cwd apps/next-16-3 type-check

      - name: Build fixture
        run: bun run --cwd apps/next-16-3 build

      - name: Install Chromium
        working-directory: apps/next-16-3
        run: bunx playwright install --with-deps chromium

      - name: Test Instant Navigations
        run: bun run --cwd apps/next-16-3 test:e2e
