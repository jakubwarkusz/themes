name: CI

on:
  push:
    branches: [main]
    paths:
      - "packages/themes/**"
      - "apps/docs/**"
      - "apps/next-16-3/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "oxlint.config.ts"
      - "oxfmt.config.ts"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/themes/**"
      - "apps/docs/**"
      - "apps/next-16-3/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "oxlint.config.ts"
      - "oxfmt.config.ts"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Audit high severity dependencies
        run: pnpm audit:high

  library:
    name: Library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @wrksz/themes type-check

      - name: Test
        run: pnpm --filter @wrksz/themes test

      - name: Build
        run: pnpm --filter @wrksz/themes build

      - name: Bundle size
        run: pnpm --filter @wrksz/themes size

      - name: Bundle size baseline
        run: pnpm --filter @wrksz/themes size:compare

  react-compatibility:
    name: React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - react: "18.3.1"
            react-types: "18.3.23"
            react-dom-types: "18.3.7"
          - react: "19.2.8"
            react-types: "19.2.18"
            react-dom-types: "19.2.5"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select React version
        env:
          REACT: ${{ matrix.react }}
          REACT_TYPES: ${{ matrix.react-types }}
          REACT_DOM_TYPES: ${{ matrix.react-dom-types }}
        run: |
          # Force one React version across the workspace (apps pin their own range),
          # then reinstall so peer links under packages/* are rewritten.
          printf '\n  react: %s\n  react-dom: %s\n' "${REACT}" "${REACT}" >> pnpm-workspace.yaml
          pnpm add --workspace-root --save-dev \
            "react@${REACT}" \
            "react-dom@${REACT}" \
            "@types/react@${REACT_TYPES}" \
            "@types/react-dom@${REACT_DOM_TYPES}"
          pnpm --filter theme-docs --filter next-16-3-compat add \
            "react@${REACT}" \
            "react-dom@${REACT}"
          pnpm --filter theme-docs --filter next-16-3-compat add --save-dev \
            "@types/react@${REACT_TYPES}" \
            "@types/react-dom@${REACT_DOM_TYPES}"
          pnpm install

      - name: Test effect event compatibility
        run: pnpm --filter @wrksz/themes test src/__tests__/use-effect-event-compat.test.tsx

      - name: Build
        run: pnpm --filter @wrksz/themes build

  typescript-compatibility:
    name: TypeScript ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "5.9.3"
            script: "type-check:compat:5.9"
          - version: "6.0.2"
            script: "type-check:compat:6"
          - version: "7.0.2"
            script: "type-check:compat:7"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source and published package
        run: pnpm --filter @wrksz/themes ${{ matrix.script }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter @wrksz/themes build

      - name: Test
        run: pnpm --filter theme-docs test

      - name: Type check
        run: pnpm --filter theme-docs types:check

      - name: Build
        run: pnpm build:docs

  next-16-3:
    name: Next.js 16.3 Instant Navigations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter @wrksz/themes build

      - name: Type check
        run: pnpm --filter next-16-3-compat type-check

      - name: Build fixture
        run: pnpm --filter next-16-3-compat build

      - name: Install Chromium
        run: pnpm --filter next-16-3-compat exec playwright install --with-deps chromium

      - name: Test Instant Navigations
        run: pnpm --filter next-16-3-compat test:e2e
