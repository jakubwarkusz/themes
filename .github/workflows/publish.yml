name: Publish to NPM registry

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish a package to NPM registry
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/themes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Set version from tag
        run: bun scripts/set-version.ts ${{ github.ref_name }}

      - name: Type check
        run: bun type-check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Declaration compatibility
        run: bun run type-check:compat

      - name: Bundle size baseline
        run: bun run size:compare

      - name: Publish to NPM registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE="${VERSION#*-}"
          if [ "$VERSION" != "$PRERELEASE" ]; then
            NPM_TAG="${PRERELEASE%%.*}"
            echo "Publishing prerelease ${VERSION} with dist-tag ${NPM_TAG}"
            npm publish --provenance --access public --tag "${NPM_TAG}"
          else
            echo "Publishing stable release ${VERSION} to latest"
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
