name: Publish to NPM registry

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish a package to NPM registry
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/themes

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Set version from tag
        run: bun scripts/set-version.ts ${{ github.ref_name }}

      - name: Type check
        run: bun type-check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Declaration compatibility
        run: bun run type-check:compat

      - name: Bundle size baseline
        run: bun run size:compare

      - name: Publish to NPM registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE="${VERSION#*-}"
          if [ "$VERSION" != "$PRERELEASE" ]; then
            NPM_TAG="${PRERELEASE%%.*}"
            echo "Publishing prerelease ${VERSION} with dist-tag ${NPM_TAG}"
            npm publish --provenance --access public --tag "${NPM_TAG}"
          else
            echo "Publishing stable release ${VERSION} to latest"
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  changelog:
    name: Update CHANGELOG.md
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit CHANGELOG.md
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changelog changes"
          else
            git commit -m "docs: update CHANGELOG.md for ${{ github.ref_name }}"
            git push
          fi
