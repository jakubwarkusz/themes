name: Publish to NPM registry

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish a package to NPM registry
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/themes

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Set version from tag
        run: pnpm exec tsx scripts/set-version.ts ${{ github.ref_name }}

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Declaration compatibility
        run: pnpm type-check:compat

      - name: Bundle size baseline
        run: pnpm size:compare

      - name: Installed package size
        run: pnpm size:package

      - name: Publish to NPM registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE="${VERSION#*-}"
          if [ "$VERSION" != "$PRERELEASE" ]; then
            NPM_TAG="${PRERELEASE%%.*}"
            echo "Publishing prerelease ${VERSION} with dist-tag ${NPM_TAG}"
            npm publish --provenance --access public --tag "${NPM_TAG}"
          else
            echo "Publishing stable release ${VERSION} to latest"
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
