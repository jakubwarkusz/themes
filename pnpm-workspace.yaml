packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
# These pinned releases were published within pnpm's default 24h
# minimumReleaseAge window; drop each exclusion on its next version bump.
minimumReleaseAgeExclude:
  - oxfmt@0.60.0
  - "@oxfmt/*"
  - oxlint@1.75.0
  - "@oxlint/*"
  - happy-dom@20.11.1
overrides:
  nanoid: 3.3.18
  postcss: 8.5.26
  sharp: 0.35.3
