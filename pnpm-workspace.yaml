packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
# These pinned releases were published within pnpm's default 24h
# minimumReleaseAge window; drop each exclusion on its next version bump.
minimumReleaseAgeExclude:
  - happy-dom@20.11.15
  - takumi-js@2.13.1
  - "@takumi-rs/*"
overrides:
  nanoid: 3.3.18
  postcss: 8.5.28
  sharp: 0.35.4
  next: ">=16.3.5"
